version: 2
registries:
  sfw:
    type: python-index
    url: https://sfw.security.sentry.io/pypi/simple
updates:
  # Python dependencies (uv reads pyproject.toml + uv.lock). Dependabot opens
  # bump PRs only — nothing auto-merges. Review each PR; for a fastmcp bump,
  # re-run the MCP auth tests and do a live OAuth + token-refresh smoke test,
  # since the MCP server's auth relies on fastmcp OAuthProxy internals.
  - package-ecosystem: "uv"
    directory: "/"
    registries:
      - sfw
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
