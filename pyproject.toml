[project]
name = "firetower"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "datadog==0.52.1",
    "datadog-api-client==2.54.0",
    "django>=5.2.15,<6",
    "django-cors-headers>=4.9.0",
    "django-fernet-encrypted-fields>=0.4.0",
    "django-kubernetes>=1.1.0",
    "djangorestframework>=3.18.1",
    "google-auth>=2.37.0",
    "psycopg[binary]>=3.2.11",
    "pyserde[toml]>=0.33.1",
    "notion-client>=3.0.0,<4.0.0",
    "requests>=2.32.0",
    "django-q2>=1.11.1",
    "slack-bolt>=1.30.0",
    "slack-sdk>=3.44.1",
    "sentry-sdk>=2.62.0",
    "openrouter>=1.1.139",
]

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "mypy>=1.15.0",
    "pyupgrade>=3.20.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.12.11",
    "ty>=0.0.80",
    "django-stubs>=5.2.7",
    "django-stubs-ext>=5.2.7",
    "blessed>=1.39.0",
]
prod = [
    "ddtrace==4.8.2",
    "granian>=2.6.0",
    "sentry-sdk[django]>=2.62.0",
]
mcp = [
    "fastmcp>=3.4.1",
    "pyjwt[crypto]>=2.14.0",
    "firetower-sdk",
]

[[tool.uv.index]]
name = "sfw"
url = "https://sfw.security.sentry.io/pypi/simple"
default = true

[tool.uv.sources]
firetower-sdk = { path = "sdk", editable = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "firetower.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["src"]

[tool.django-stubs]
django_settings_module = "firetower.settings"
